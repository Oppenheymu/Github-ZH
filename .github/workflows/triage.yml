# 自动分诊流水线（形态照搬 Koishi-CE 的 .github/workflows/triage.yml）。
#
# 两个独立 job：
# - triage-issue 新 issue 自动分诊：assign 给仓库维护者并打「状态:待确认」作为
#   待处理队列的初始状态。类型 label（类型:缺陷 / 类型:增强）本应由 issue 模板
#   自带，但本仓还没有 ISSUE_TEMPLATE，故暂时只能手动打——补模板是下一步。
# - label-pr 按 .github/labeler.yml 的路径规则自动打「范围」与「类型:文档」，
#   只增不减（sync-labels 关闭）。
# - PR 不做自动 assign：社区作者非协作者会导致 assign 失败，收益近零不如不做。
#
# assignee 写死 Oppenheymu（repository_owner 在迁到组织后会变成组织名，不能当
# assignee 用）；引入第二维护者前没有按内容分派的空间。
#
# 引用的标签必须先在仓库设置里存在：标签不存在时 gh issue edit 整条报错、
# actions/labeler 报 label not found，都属于「只在 issue / PR 页面上可见」的失败。

name: Triage

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  triage-issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 自动指派并标记待确认
        run: |
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --add-assignee "Oppenheymu" \
            --add-label "状态:待确认"
        env:
          GH_TOKEN: ${{ github.token }}

  label-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 按路径自动打标
        uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
