name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: 全量门禁（lint + typecheck + check:dict + check:manifest + test）
        run: bun run check
