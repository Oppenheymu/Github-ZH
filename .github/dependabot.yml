# Dependabot 依赖更新配置
#
# 本仓库是 Bun + TypeScript 的浏览器扩展，受管依赖只有两块：
# - github-actions：workflow 里 pin 到 commit SHA 的 action（PR 里只改 SHA 与注释，
#   合并前需人工确认版本注释同步更新）；
# - npm：devDependencies（Biome / TypeScript / 类型声明）。Bun 复用
#   package.json + bun.lock，Dependabot 侧的生态名仍写 npm；若 PR 只改了
#   package.json，合并后需本地跑 bun install 让 bun.lock 跟上。
#
# 两个生态都每周检查一次、按生态分组以减少 PR 噪声，并限制同时打开的 PR 数量。
# 安全更新不受分组与数量限制影响（Dependabot 会单独开 PR）。

version: 2

updates:
  # GitHub Actions：只更新 workflow 引用的 action
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "范围:构建与工具链"
    groups:
      # 所有 action 的常规更新合成一个 PR，便于一次性按 SHA 重新 pin
      github-actions:
        patterns:
          - "*"

  # npm：package.json 里的开发依赖（扩展产物零运行时依赖）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "范围:构建与工具链"
    groups:
      # 次版本与补丁版本合并；主版本单独开 PR，强制人工评估
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
