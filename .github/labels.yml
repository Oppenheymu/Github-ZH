# 标签词表（唯一权威来源）
#
# 仓库里所有标签都在这里声明，GitHub 上的实际状态由 `bun run labels` 同步：
# 新增 / 改名 / 换色 / 改描述只改本文件，再跑一次脚本或等 labels workflow 落地。
# 不要在网页上直接改标签——下次同步会把它按本文件覆盖回去（删除需显式 --prune）。
#
# 维度与命名约定：`维度:值` 前缀便于在 GitHub 的标签筛选框里按维度过滤。
# - 类型：这条 issue / PR 是什么，每条恰好一个；
# - 范围：改动落在哪一块，PR 由路径规则自动打，可多个；
# - 语言：涉及哪种目标语言的词典；
# - 状态：人工维护的流转状态，从「待确认」开始。
#
# 本表覆盖仓库的全部标签：GitHub 自带的 10 个英文默认标签已按本表清理干净，
# 现不再存在。收尾类标签（重复 / 无效 / 不予处理）用到时也在这里、在「状态」
# 维度下新增，不要绕过本表在网页上单建。
#
# 已删除的 `good first issue` / `help wanted` 单独说明：GitHub 只在标签名与这
# 两个字符串完全一致时，才在仓库首页渲染 Contribute 入口。将来想恢复该入口，
# 把这两个英文名按原样加回本表（不带维度前缀）即可，无需别的操作。
#
# 字段：name（≤50 字符）/ color（6 位十六进制，不带 #）/ description（≤100 字符）。

# ── 类型 ────────────────────────────────────────────────────────────────
- name: "类型:缺陷"
  color: "d73a4a"
  description: "行为与预期不符：漏翻、误翻、扩展自身功能失效"
- name: "类型:增强"
  color: "a2eeef"
  description: "新功能，或对现有行为的改进"
- name: "类型:文档"
  color: "0075ca"
  description: "文档的补充或修正"
- name: "类型:维护"
  color: "bfd4f2"
  description: "依赖升级、重构、CI 与日常杂务"

# ── 范围 ────────────────────────────────────────────────────────────────
- name: "范围:词典"
  color: "0e8a16"
  description: "src/dict/**：词条、规则、别名与模块路由"
- name: "范围:翻译引擎"
  color: "1d76db"
  description: "src/content/**：DOM 遍历、匹配与排除选择器"
- name: "范围:弹窗与设置"
  color: "5319e7"
  description: "src/popup/**、src/shared/**：开关、语言选择与存储"
- name: "范围:构建与工具链"
  color: "c5def5"
  description: "tooling/**、.github/** 与根目录配置"

# ── 语言 ────────────────────────────────────────────────────────────────
- name: "语言:zh-CN"
  color: "b60205"
  description: "简体中文词典"
- name: "语言:ja"
  color: "d93f0b"
  description: "日语词典"
- name: "语言:新增"
  color: "fef2c0"
  description: "请求支持一个新的目标语言"

# ── 状态（人工维护的流转）───────────────────────────────────────────────
- name: "状态:待确认"
  color: "fbca04"
  description: "新 issue 的初始状态，等待维护者确认"
- name: "状态:已确认"
  color: "0e8a16"
  description: "已复现或已接受，等待排期"
- name: "状态:进行中"
  color: "1d76db"
  description: "正在处理"
- name: "状态:等待回复"
  color: "d4c5f9"
  description: "需要报告者补充信息"
